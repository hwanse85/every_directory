name: Desktop builds
on: [push, pull_request, workflow_dispatch]
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run test:rust
      - name: Windows dependency notices
        if: runner.os == 'Windows'
        run: npm run licenses:check -- --native
      - name: Windows WebView2 end-to-end checks
        if: runner.os == 'Windows'
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: Windows-E2E-reports
          path: test-results/e2e/
      - run: npm run desktop:build
      - name: Check Windows executable privacy
        if: runner.os == 'Windows'
        run: npm run privacy:check -- --binary src-tauri/target/release/every-directory.exe
      - name: Check macOS executable privacy
        if: runner.os == 'macOS'
        run: npm run privacy:check -- --binary "src-tauri/target/release/bundle/macos/Every Directory.app/Contents/MacOS/every-directory"
      - uses: actions/upload-artifact@v4
        with:
          name: EveryDirectory-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*-setup.exe
